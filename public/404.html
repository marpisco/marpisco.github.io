<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 | Marco Pisco</title>
    <meta name="robots" content="noindex" />
    <style>
      :root {
        color-scheme: light;
        --bg: #f3f2ef;
        --surface: rgba(255, 255, 255, 0.94);
        --surface-2: #eef0f2;
        --text: #1f1f1f;
        --muted: #666666;
        --line: #d7d7d7;
        --line-strong: #b8b8b8;
        --red: #b4232f;
        --green: #60756f;
        --orange: #d97706;
        --grid: rgba(31, 31, 31, 0.06);
        --mono: 'Courier New', Courier, monospace;
        --sans: Arial, Helvetica, sans-serif;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          color-scheme: dark;
          --bg: #151414;
          --surface: rgba(30, 29, 29, 0.96);
          --surface-2: #282626;
          --text: #f5f4f1;
          --muted: #b1adaa;
          --line: #413c3c;
          --line-strong: #5b5353;
          --red: #ef5964;
          --green: #98b2a5;
          --orange: #f0a15b;
          --grid: rgba(224, 214, 207, 0.08);
        }
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
      }

      body {
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        color: var(--text);
        background: var(--bg);
        font-family: var(--sans);
      }

      .page-bg {
        position: fixed;
        inset: 0;
        z-index: -1;
        background-image:
          linear-gradient(var(--grid) 1px, transparent 1px),
          linear-gradient(90deg, var(--grid) 1px, transparent 1px),
          radial-gradient(circle at 12% 4%, rgba(180, 35, 47, 0.12), transparent 32%),
          radial-gradient(circle at 92% 22%, rgba(217, 119, 6, 0.08), transparent 28%);
        background-size: 64px 64px, 64px 64px, auto, auto;
      }

      .window {
        width: min(720px, 100%);
        overflow: hidden;
        border: 1px solid var(--line-strong);
        border-radius: 12px;
        background: var(--surface);
        box-shadow: 0 18px 50px rgba(25, 25, 25, 0.12);
      }

      .bar {
        min-height: 44px;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0 15px;
        border-bottom: 1px solid var(--line);
        background: var(--surface-2);
      }

      .dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: var(--line-strong);
      }

      .dot:first-child {
        background: var(--red);
      }

      .dot:nth-child(2) {
        background: var(--orange);
      }

      .dot:nth-child(3) {
        background: var(--green);
      }

      .tab {
        margin-left: 10px;
        color: var(--muted);
        font-family: var(--mono);
        font-size: 0.72rem;
      }

      .content {
        padding: clamp(38px, 8vw, 86px);
      }

      .comment,
      .code,
      .button {
        font-family: var(--mono);
      }

      .comment {
        margin: 0 0 20px;
        color: var(--green);
        font-size: clamp(0.72rem, 1.5vw, 0.9rem);
        font-weight: 700;
      }

      .comment::before {
        content: '// ';
      }

      h1 {
        margin: 0;
        font-size: clamp(4.8rem, 18vw, 10rem);
        line-height: 0.85;
        letter-spacing: -0.08em;
      }

      h1 span {
        display: block;
        margin-bottom: 18px;
        color: var(--red);
        font-family: var(--mono);
        font-size: clamp(0.86rem, 2vw, 1.1rem);
        letter-spacing: 0;
      }

      .message {
        max-width: 520px;
        margin: 28px 0 0;
        color: var(--muted);
        font-size: clamp(1rem, 2vw, 1.22rem);
        line-height: 1.65;
      }

      .code {
        color: var(--green);
      }

      .button {
        min-height: 44px;
        display: inline-flex;
        align-items: center;
        margin-top: 30px;
        padding: 0 16px;
        color: #ffffff;
        border: 1px solid var(--red);
        border-radius: 7px;
        background: var(--red);
        font-size: 0.75rem;
        font-weight: 700;
        text-decoration: none;
      }

      .button:hover {
        filter: brightness(1.08);
      }

      @media (max-width: 480px) {
        body {
          padding: 12px;
        }

        .content {
          padding: 38px 24px 42px;
        }
      }
    </style>
  </head>
  <body>
    <div class="page-bg" aria-hidden="true"></div>
    <main class="window" aria-labelledby="error-title">
      <div class="bar" aria-hidden="true">
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="tab">404.html</span>
      </div>
      <div class="content">
        <p class="comment">Route not found</p>
        <h1 id="error-title"><span>const status =</span>404</h1>
        <p class="message">
          The page you requested does not exist. Return to the portfolio entry point
          and continue exploring.
        </p>
        <p class="message code">return "home";</p>
        <a class="button" href="/">Back to marcopisco.com <span aria-hidden="true">&nbsp;→</span></a>
      </div>
    </main>
  </body>
</html>
